<title>visual-walkthrough viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* visual-walkthrough の固定ビューア。中身は page.json（文言）と capture/<lane>.json（撮影）から入る。
   画面は Playwright のスクリーンショット（本物のピクセル）で、その上に押した場所の枠とホットスポットを重ねる。
   色の意味は visual-explainer と同じ: 緑=追加・提案、琥珀=いま押している所、紺=元からある物。 */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F4F7; --ink:#0F1A26; --muted:#4F5B69; --line:#D5DCE3; --edge:#4A5664;
  --navy:#1E3A5C; --navy-soft:#DDE6F0; --on-navy:#FFFFFF;
  --grow:#12775D; --grow-soft:#D8EFE7;
  --false:#B5322C; --false-soft:#F8E3E1;
  --amber:#B97C06; --amber-soft:#FBEFD3;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;padding:0 20px}
.wrap{max-width:1440px;margin:0 auto;padding-block:36px 72px;display:flex;flex-direction:column;gap:52px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:clamp(26px,3.4vw,36px);font-weight:900}
h2{font-size:clamp(21px,2.4vw,26px);font-weight:900}
h3{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
section{display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.sec-head p{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.warn{border-color:var(--amber);background:var(--amber-soft);color:var(--ink)}
.tag.ok{border-color:var(--grow);background:var(--grow-soft);color:var(--grow);font-weight:700}
.mono,code{font-family:var(--f-mono);font-size:.92em}
.add{color:var(--grow)} .del{color:var(--false)} .strike{text-decoration:line-through}

/* header */
.pr-head{display:flex;flex-direction:column;gap:14px}
.pr-meta{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:14px;color:var(--muted);align-items:center}
.pr-meta b{color:var(--ink)}
.br{padding:2px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px}
.br.pr{background:var(--grow-soft);border-color:var(--grow);color:var(--grow);font-weight:700}
.impact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.impact{grid-template-columns:1fr}}
.imp{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.imp.req{border:2.5px solid var(--grow)}
.imp .k{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imp .v{font-size:15px;font-weight:700}
.imp .f{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.imp ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}

/* controls */
.ctl{display:flex;flex-direction:column;gap:10px;border:2.5px solid var(--navy);border-radius:16px;padding:14px;background:var(--surface)}
.cap{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cap .no{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.cap .t{font-family:var(--f-display);font-size:clamp(18px,2.2vw,22px);font-weight:900}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:10px}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;font-weight:700;min-height:52px;padding:0 22px}
button:hover{border-color:var(--navy)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy);min-width:150px;font-size:19px}
button:disabled{opacity:.4;cursor:default}
.scrub{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px;height:52px;cursor:pointer;touch-action:none;padding:0 4px}
.scrub .rail{position:relative;flex:1;height:10px;border-radius:999px;background:var(--line)}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--amber)}
.scrub .knob{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--surface);border:4px solid var(--amber);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.scrub .time{font-family:var(--f-mono);font-size:14px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:44px;font-size:15px;padding:0 16px;background:var(--surface);color:var(--muted)}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--navy);color:var(--on-navy)}
.seg button.on.pr{background:var(--grow)}
.viewrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

/* stage */
.stage{display:grid;gap:14px;align-items:start}
.stage.single{grid-template-columns:minmax(0,1fr) 380px}
.stage.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stage.single .screen.hidden{display:none}
.stage.split .db{grid-column:1 / -1}
.stage.split .dbbody{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{border:1.5px solid var(--line);border-radius:16px;background:var(--surface);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.panel.after{border:2.5px solid var(--grow)}
.panel.db{border:2.5px solid var(--navy)}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-weight:700;flex-wrap:wrap}
.ph .sp{flex:1}
.ph .who{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);overflow-wrap:anywhere}
.panel.after .ph{background:var(--grow-soft)}
.panel.db .ph{background:var(--navy-soft)}
/* the screenshot: percentages keep the highlight and hotspots aligned at any width */
.shot{position:relative;width:100%;background:#E9EDF2;min-height:120px}
.shot img{display:block;width:100%;height:auto}
.shot.absent img{filter:grayscale(.6) opacity(.5)}
.shot .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.hl{position:absolute;box-sizing:border-box;outline:3px solid var(--amber);outline-offset:3px;border-radius:5px;pointer-events:none;animation:pulse 1.1s ease-in-out infinite}
.panel.after .hl.prop{outline-color:var(--grow)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(185,124,6,.55)}50%{box-shadow:0 0 0 14px rgba(185,124,6,0)}}
.still .hl{animation:none}
.hl .act{position:absolute;left:50%;top:100%;transform:translate(-50%,10px);background:var(--amber);color:#fff;font:700 13.5px/1.6 var(--f-body);padding:2px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hl.up .act{top:auto;bottom:100%;transform:translate(-50%,-10px)}
.hl.edge-r .act{left:auto;right:0;transform:translate(0,10px)} .hl.up.edge-r .act{transform:translate(0,-10px)}
.hl.edge-l .act{left:0;transform:translate(0,10px)} .hl.up.edge-l .act{transform:translate(0,-10px)}
.hl.inside .act{left:auto;right:8px;top:50%;bottom:auto;transform:translateY(-50%)}
.panel.after .hl.prop .act{background:var(--grow)}
.hot{position:absolute;border:0;border-radius:5px;background:transparent;min-height:0;padding:0;cursor:pointer;outline-offset:2px}
.hot:hover{background:rgba(185,124,6,.12)}
.hot:focus-visible{outline:3px solid var(--amber)}
.absent-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--amber);color:#fff;font-weight:900;font-family:var(--f-display);font-size:18px;padding:8px 18px;border-radius:999px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2);text-align:center}
.panel.after .absent-badge{background:var(--grow)}
.shot.absent .absent-badge{display:block}
.notes{display:flex;flex-direction:column;border-top:1px dashed var(--line)}
.note{padding:6px 12px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:baseline;min-height:32px}
.note .lbl{font-family:var(--f-mono);font-size:11.5px;padding:0 7px;border-radius:6px;background:var(--surface-2);white-space:nowrap}
.note.pr .lbl{background:var(--grow-soft);color:var(--grow);font-weight:700}
.note.warn{color:var(--amber);font-weight:700;background:var(--amber-soft)}
.note.ok{color:var(--grow);font-weight:700;background:var(--grow-soft)}

/* DB / storage / requests */
.dbbody{padding:12px;display:flex;flex-direction:column;gap:14px}
.dbcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.dbt{display:flex;flex-direction:column;gap:6px;min-width:0}
.dbt .tn{font-family:var(--f-mono);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dbt .tn .cnt{font-weight:500;color:var(--muted)}
.dbt .tw{overflow:auto;max-height:190px;border:1px solid var(--surface-2);border-radius:8px}
.dbt table{width:100%;border-collapse:collapse;font-size:12.5px;font-family:var(--f-mono)}
.dbt th{font-weight:500;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1.5px solid var(--line);font-size:11.5px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.dbt td{padding:4px 8px;border-bottom:1px solid var(--surface-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.dbt tr.ins td{background:var(--grow-soft);color:var(--grow);font-weight:700;animation:pop .4s ease both}
.dbt tr.ins td:first-child{box-shadow:inset 4px 0 0 var(--grow)}
.dbt tr.upd td{background:var(--amber-soft)}
.dbt .empty{font-size:12.5px;color:var(--muted);padding:6px 8px}
.log{display:flex;flex-direction:column;gap:6px}
.log .ln{font-family:var(--f-mono);font-size:12.5px;padding:6px 9px;border-radius:8px;background:var(--surface-2);color:var(--muted);overflow-wrap:anywhere;border-left:3px solid var(--line);line-height:1.55}
.log .ln.now{background:var(--surface);border:1.5px solid var(--navy);border-left:4px solid var(--navy);color:var(--ink);font-weight:500;animation:pop .35s ease both}
.log .ln.ext{border-left-color:var(--amber);background:var(--amber-soft);color:var(--ink)}
.log .ln.ext.now{border-color:var(--amber)}
.log .ln.diff{border-left-color:var(--grow);color:var(--grow);font-weight:700}
.log .ln .anno{color:var(--muted);font-size:11.5px}
.log .ln .args{display:block;color:var(--muted);font-size:12px;padding-left:1em}
.log .ln .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--amber);color:#fff;margin-right:6px;vertical-align:1px}
.log .empty{font-size:13px;color:var(--muted);padding:6px 9px}
.still .ins td,.still .ln.now{animation:none}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* checks / details */
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.checks{grid-template-columns:1fr}}
.chk{border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chk .st{align-self:flex-start;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px}
.chk .st.ok{background:var(--grow-soft);color:var(--grow)}
.chk .st.todo{background:var(--amber-soft);color:var(--amber)}
.chk .st.none{background:var(--surface-2);color:var(--muted)}
.chk p{font-size:14px;color:var(--muted)}
.chk .jump{align-self:flex-start;min-height:38px;font-size:14px;padding:0 14px;border-radius:10px}
details{border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:700}
details ul{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:14.5px}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:6px 18px}
.err{border:2px solid var(--false);background:var(--false-soft);border-radius:12px;padding:12px 16px;font-size:14px}

/* narrow screens: declared last so they win over the component rules above */
@media (max-width:1100px){
  .stage.single,.stage.split{grid-template-columns:1fr}
  .stage.split .dbbody{grid-template-columns:1fr}
  .bar button{flex:1 1 auto}
  .scrub{flex:1 1 100%}
}
@media (max-width:520px){
  body{padding:0 16px}
  button{padding:0 14px;font-size:15px}
  button.primary{min-width:0;font-size:16px}
  .seg button{padding:0 10px;font-size:13.5px}
  .hl .act{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header class="pr-head">
  <div class="tags" id="tags"></div>
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="h1">読み込み中…</h1>
  <div class="pr-meta" id="meta"></div>
  <div class="impact" id="cards"></div>
</header>

<section>
  <div class="ctl" id="ctl">
    <div class="cap"><span class="no" id="capNo">– / –</span><span class="t" id="capT">撮影データを読み込んでいます…</span></div>
    <div class="bar">
      <button id="prev" aria-label="前へ">◀ 前へ</button>
      <button id="play" class="primary">▶ 再生</button>
      <button id="next" aria-label="次へ">次へ ▶</button>
      <div class="scrub" id="scrub" role="slider" aria-label="再生位置" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="rail"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
        <span class="time" id="time">0:00 / 0:00</span>
      </div>
    </div>
    <div class="viewrow">
      <span>表示</span>
      <div class="seg" role="group" aria-label="表示する画面">
        <button data-view="before" id="segB"></button>
        <button class="pr" data-view="after" id="segA"></button>
        <button data-view="split">並べて</button>
      </div>
      <span id="viewHint"></span>
    </div>
  </div>

  <div class="stage split" id="stage">
    <div class="panel screen before" data-branch="before">
      <div class="ph"><span id="labB"></span><span class="sp"></span><span class="who" id="whoB"></span></div>
      <div class="shot" id="shotB"><div class="loading">読み込み中…</div><div class="absent-badge" id="absB"></div></div>
      <div class="notes" id="notesB"></div>
    </div>
    <div class="panel screen after" data-branch="after">
      <div class="ph"><span id="labA"></span><span class="sp"></span><span class="who" id="whoA"></span></div>
      <div class="shot" id="shotA"><div class="loading">読み込み中…</div><div class="absent-badge" id="absA"></div></div>
      <div class="notes" id="notesA"></div>
    </div>
    <div class="panel db">
      <div class="ph"><span id="dbTitle">DB と通信</span><span class="sp"></span><span class="who" id="dbWho"></span></div>
      <div class="dbbody">
        <div class="dbcol" id="tables"></div>
        <div class="dbt">
          <div class="tn">通信ログ <span class="cnt" id="logHint"></span></div>
          <div class="log" id="log"><div class="empty">読み込み中…</div></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="checksSec">
  <div class="sec-head"><p class="eyebrow" id="chkEyebrow"></p><h2 id="chkH2"></h2><p id="chkP"></p></div>
  <div class="checks" id="checks"></div>
  <div id="details" style="display:flex;flex-direction:column;gap:12px"></div>
</section>

<footer class="foot" id="foot"></footer>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PAGE=null,CAP={before:null,after:null},cur=0,view='split';
const FR=()=>CAP.before.frames;
const dur=i=>(PAGE.durations&&(PAGE.durations[FR()[i].id]??PAGE.durations.default))||2600;

// ---------- static copy from page.json ----------
function fillPage(p){
  document.title=p.title||document.title;
  $('tags').innerHTML=(p.tags||[]).map(t=>`<span class="tag ${t.kind||''}">${esc(t.text)}</span>`).join('');
  $('eyebrow').textContent=p.eyebrow||'';
  $('h1').textContent=p.h1||'';
  $('meta').innerHTML=(p.meta||[]).map(m=>`<span>${m}</span>`).join('');
  $('cards').innerHTML=(p.cards||[]).map(c=>`<div class="imp ${c.kind||''}"><span class="k">${c.k||''}</span>${c.v?`<span class="v">${c.v}</span>`:''}${c.list?`<ul>${c.list.map(li=>`<li>${li}</li>`).join('')}</ul>`:''}${c.f?`<span class="f">${esc(c.f)}</span>`:''}</div>`).join('');
  const L=p.lanes;
  $('segB').textContent=L.before.short||L.before.label;$('segA').textContent=L.after.short||L.after.label;
  $('labB').textContent=L.before.label;$('labA').textContent=L.after.label;
  $('whoB').textContent=L.before.who||'';$('whoA').textContent=L.after.who||'';
  $('absB').textContent=L.before.absent||'この操作がない';$('absA').textContent=L.after.absent||'この操作がない';
  $('viewHint').textContent=p.viewHint||'';
  $('dbTitle').textContent=p.dbTitle||'DB と通信';$('dbWho').textContent=p.dbWho||'';
  $('logHint').textContent=p.logHint||'';
  if(p.checks&&p.checks.length){
    $('chkEyebrow').textContent=p.checksHead?.eyebrow||'REVIEW POINTS';$('chkH2').textContent=p.checksHead?.h2||'レビューで見るところ';$('chkP').textContent=p.checksHead?.p||'';
    $('checks').innerHTML=p.checks.map(c=>`<div class="chk"><span class="st ${c.st||'none'}">${esc(c.stText||({ok:'撮影で確認',todo:'要確認',none:'未撮影'})[c.st]||'')}</span><h3>${esc(c.title)}</h3><p>${c.text||''}</p>${c.jump!=null?`<button class="jump" data-jump="${c.jump}"${c.disabled?' disabled':''}>${esc(c.jumpText||'その場面へ')}</button>`:''}</div>`).join('');
  }else $('checksSec').querySelector('.sec-head').style.display='none';
  $('details').innerHTML=(p.details||[]).map(d=>`<details><summary>${esc(d.summary)}</summary><ul>${d.items.map(i=>`<li>${i}</li>`).join('')}</ul></details>`).join('');
  $('foot').innerHTML=(p.foot||[]).map(f=>`<span>${f}</span>`).join('')+'<span id="footMeta"></span>';
}

// ---------- screenshot panels ----------
const imgCache=new Map();
function preload(lane){for(const f of CAP[lane].frames){if(!imgCache.has(f.image)){const im=new Image();im.src=PAGE.captureDir+'/'+f.image;imgCache.set(f.image,im);}}}
function paintShot(el,f,lane,still){
  const isProp=lane==='after'&&PAGE.mode==='issue';
  const badge=el.querySelector('.absent-badge');
  el.classList.toggle('absent',!!f.absent);
  let img=el.querySelector('img');
  if(!img){img=document.createElement('img');img.alt='';el.insertBefore(img,badge);el.querySelector('.loading')?.remove();}
  img.src=PAGE.captureDir+'/'+f.image;
  img.style.aspectRatio=`${f.w} / ${f.h}`;
  el.querySelectorAll('.hl,.hot').forEach(n=>n.remove());
  const pct=(v,base)=>(v/base*100).toFixed(3)+'%';
  if(f.hl&&!f.absent){
    const d=document.createElement('div');
    d.className='hl'+(f.up?' up':'')+(isProp?' prop':'');
    if(f.hl.x+f.hl.w/2>f.w-140)d.classList.add('edge-r');
    if(f.hl.x+f.hl.w/2<140)d.classList.add('edge-l');
    if(f.hl.w>f.w*0.5&&f.hl.h<80)d.classList.add('inside');
    d.style.cssText=`left:${pct(f.hl.x,f.w)};top:${pct(f.hl.y,f.h)};width:${pct(f.hl.w,f.w)};height:${pct(f.hl.h,f.h)}`;
    if(f.act){const t=document.createElement('span');t.className='act';t.textContent=f.act;d.appendChild(t);}
    el.insertBefore(d,badge);
  }
  for(const h of f.hotspots||[]){
    const b=document.createElement('button');
    b.className='hot';b.type='button';b.title=(h.name?`「${h.name}」を押す`:'次へ');b.setAttribute('aria-label',b.title);
    b.style.cssText=`left:${pct(h.x,f.w)};top:${pct(h.y,f.h)};width:${pct(h.w,f.w)};height:${pct(h.h,f.h)}`;
    b.onclick=()=>{stop();show(h.next);};
    el.insertBefore(b,badge);
  }
}
function setNotes(el,fB,fA){
  const line=(cls,lbl,f)=>{const txt=f?.note||'';return `<div class="note ${cls}${f&&txt&&(f.warn||f.absent)?' warn':''}${f&&txt&&f.ok?' ok':''}"><span class="lbl">${esc(lbl)}</span><span>${esc(txt)}</span></div>`;};
  el.innerHTML=line('pr',PAGE.lanes.after.short||PAGE.lanes.after.label,fA)+line('cur',PAGE.lanes.before.short||PAGE.lanes.before.label,fB);
}

// ---------- DB / requests ----------
function renderDB(i){
  const lane=PAGE.dbLane||(view==='before'?'before':'after');
  const frames=CAP[lane].frames,f=frames[i];
  let html='';
  for(const t of f.db.tables||[]){
    const n=t.rows.length;
    html+=`<div class="dbt"><div class="tn">${esc(t.name)} <span class="cnt">${n} 行${t.ins.length?` · +${t.ins.length}`:''}${t.upd.length?` · ~${t.upd.length}`:''}</span></div>`;
    if(!n){html+=`<div class="empty">まだ行はありません</div></div>`;continue;}
    html+=`<div class="tw"><table><thead><tr>${t.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
    for(const r of t.rows){const cls=t.ins.includes(r.id)?' class="ins"':t.upd.includes(r.id)?' class="upd"':'';html+=`<tr${cls}>${r.cells.map(c=>`<td title="${esc(c)}">${esc(c)}</td>`).join('')}</tr>`;}
    html+='</tbody></table></div></div>';
  }
  $('tables').innerHTML=html||'<div class="dbt"><div class="empty">この撮影では DB を記録していません</div></div>';
  const ann=PAGE.annotate||{};
  const lines=[];
  for(let k=0;k<=i;k++){
    const fk=frames[k];const now=k===i;
    for(const q of fk.req||[]){
      if(q.kind==='external'){
        const st=q.status==='mock'?(PAGE.externalMockText||'Claude の代替応答'):q.status==='blocked'?'遮断':q.status;
        lines.push(`<div class="ln ext${now?' now':''}"><span class="badge">外部 API</span>${esc(q.service)} · ${esc(q.method)}(${esc(q.path)}) → ${esc(st)} <span class="anno">${esc((PAGE.externalLabels||{})[q.note]||q.note||'')}${q.images?` · 画像 ${q.images} 枚`:''}</span></div>`);
      }else{
        const st=q.status==null?'…':q.status;
        const key=Object.keys(ann).find(p=>q.path.startsWith(p)&&(!ann[p].status||ann[p].status===q.status));
        const a=key?ann[key]:null;
        const label=a?(typeof a==='string'?a:a.text):(q.sub==='server-action'?'Server Action':q.sub==='rsc'?'画面の再取得（router.refresh）':'');
        let args='';
        if(q.sub==='server-action'&&q.body){try{const arr=JSON.parse(q.body);const o=arr[0];args=`<span class="args">${esc(typeof o==='object'?Object.entries(o).filter(([,v])=>v!=null&&v!=='none').map(([k2,v])=>`${k2}: ${JSON.stringify(v)}`).join(', '):String(o))}</span>`;}catch{}}
        lines.push(`<div class="ln${now?' now':''}">${esc(q.method)} ${esc(q.path.replace(/\??_rsc=[^&]*/,'').replace(/[?&]$/,''))} → ${st}${label?` <span class="anno">${esc(label)}</span>`:''}${args}</div>`);
      }
    }
    for(const t of fk.db.tables||[])for(const id of t.ins){const r=t.rows.find(x=>x.id===id);lines.push(`<div class="ln diff${now?' now':''}">INSERT ${esc(t.name)} ${esc(r?r.cells[0]:id)}${r&&r.cells[1]?` · ${esc(r.cells[1])}`:''}</div>`);}
  }
  $('log').innerHTML=lines.length?lines.join(''):'<div class="empty">まだ通信はありません</div>';
}

// ---------- frame / view ----------
function show(i,still){
  cur=Math.max(0,Math.min(FR().length-1,i));
  const fB=CAP.before.frames[cur],fA=CAP.after.frames[cur];
  $('stage').classList.toggle('still',!!still);
  if(view!=='after')paintShot($('shotB'),fB,'before',still);
  if(view!=='before')paintShot($('shotA'),fA,'after',still);
  setNotes($('notesA'),fB,fA);setNotes($('notesB'),fB,fA);
  renderDB(cur);
  $('capNo').textContent=(cur+1)+' / '+FR().length;
  $('capT').textContent=(view==='after'?fA:fB).cap;
  $('prev').disabled=cur===0;$('next').disabled=cur===FR().length-1;
  updateScrub();
}
function setView(v){
  view=v;const st=$('stage');
  st.classList.toggle('single',v!=='split');st.classList.toggle('split',v==='split');
  document.querySelector('.screen.before').classList.toggle('hidden',v==='after');
  document.querySelector('.screen.after').classList.toggle('hidden',v==='before');
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  try{localStorage.setItem('visual-walkthrough-view:'+(PAGE.storageKey||PAGE.title),v);}catch{}
  show(cur,true);
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setView(b.dataset.view));

// ---------- player ----------
let total=0,starts=[],playing=false,timer=null,frameStart=0;
const fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function updateScrub(el){const e=starts[cur]+(el||0);const p=Math.min(100,e/total*100);$('fill').style.width=p+'%';$('knob').style.left=p+'%';$('time').textContent=fmt(e)+' / '+fmt(total);$('scrub').setAttribute('aria-valuenow',Math.round(p));}
function tick(){if(!playing)return;const el=performance.now()-frameStart;if(el>=dur(cur)){if(cur>=FR().length-1){stop();updateScrub(dur(cur));return;}show(cur+1);frameStart=performance.now();}else updateScrub(el);timer=requestAnimationFrame(tick);}
function play(){if(cur>=FR().length-1)show(0);playing=true;frameStart=performance.now();$('play').textContent='❚❚ 一時停止';timer=requestAnimationFrame(tick);}
function stop(){playing=false;cancelAnimationFrame(timer);$('play').textContent='▶ 再生';}
$('play').onclick=()=>playing?stop():play();
$('prev').onclick=()=>{stop();show(cur-1,true);};
$('next').onclick=()=>{stop();show(cur+1);};
document.addEventListener('click',e=>{const b=e.target.closest('.jump');if(b){stop();show(+b.dataset.jump,true);$('ctl').scrollIntoView({behavior:'smooth',block:'start'});}});
document.addEventListener('keydown',e=>{if(e.target.closest('button,input,textarea,[role=slider]'))return;if(e.key==='ArrowRight'){stop();show(cur+1);}else if(e.key==='ArrowLeft'){stop();show(cur-1,true);}else if(e.key===' '){e.preventDefault();playing?stop():play();}});
const scrub=$('scrub');
function seekAt(x){const r=scrub.querySelector('.rail').getBoundingClientRect();const p=Math.max(0,Math.min(1,(x-r.left)/r.width));const t=p*total;let i=0;while(i<FR().length-1&&starts[i+1]<=t)i++;stop();show(i,i<cur);updateScrub(t-starts[i]);}
let drag=false;
scrub.addEventListener('pointerdown',e=>{drag=true;scrub.setPointerCapture(e.pointerId);seekAt(e.clientX);});
scrub.addEventListener('pointermove',e=>{if(drag)seekAt(e.clientX);});
scrub.addEventListener('pointerup',()=>{drag=false;});
scrub.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();show(cur+1);}if(e.key==='ArrowLeft'){stop();show(cur-1,true);}});

// ---------- boot ----------
['prev','play','next'].forEach(id=>$(id).disabled=true);
fetch('page.json').then(r=>{if(!r.ok)throw new Error('page.json '+r.status);return r.json();}).then(async p=>{
  PAGE=p;PAGE.captureDir=p.captureDir||'capture';
  fillPage(p);
  const [b,a]=await Promise.all([fetch(`${PAGE.captureDir}/${p.lanes.before.file}`),fetch(`${PAGE.captureDir}/${p.lanes.after.file}`)].map(pr=>pr.then(r=>{if(!r.ok)throw new Error(r.url.split('/').pop()+' '+r.status);return r.json();})));
  CAP={before:b,after:a};
  if(b.frames.length!==a.frames.length)console.warn('frame count differs',b.frames.length,a.frames.length);
  total=0;starts=[];b.frames.forEach((f,i)=>{starts[i]=total;total+=dur(i);});
  preload('before');preload('after');
  ['prev','play','next'].forEach(id=>$(id).disabled=false);
  $('footMeta').textContent=`撮影 ${new Date(b.capturedAt).toLocaleString('ja-JP')} · ${b.viewport.width}×${b.viewport.height} @${b.dpr}x · ${b.frames.length} コマ`;
  let v=p.defaultView||'split';try{v=localStorage.getItem('visual-walkthrough-view:'+(p.storageKey||p.title))||v;}catch{}
  if(!['after','before','split'].includes(v))v=p.defaultView||'split';
  setView(v);
}).catch(err=>{
  $('capT').textContent='読み込めませんでした: '+err.message;
  $('h1').textContent='読み込みエラー';
  document.querySelectorAll('.shot .loading').forEach(n=>n.textContent='読み込み失敗');
});
})();
</script>
